[package]
name = "replay-viewer"
version = "1.0.0"
description = "Lightweight screenshot, annotation, visual clipboard, and replay buffer desktop app"
authors = ["spaing8"]
edition = "2021"
license = "MIT"

[lib]
name = "replay_viewer_lib"
crate-type = ["rlib"]

[profile.dev]
debug = 0
strip = "debuginfo"
incremental = false

[profile.dev.package."*"]
debug = 0
strip = "debuginfo"

[build-dependencies]
tauri-build = { version = "2.7", features = [] }

[dependencies]
tauri = { version = "2.12", features = ["tray-icon", "protocol-asset", "image-png"] }
tauri-plugin-global-shortcut = "2.4"
tauri-plugin-clipboard-manager = "2.5"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
thiserror = "2.0"
rusqlite = { version = "0.32", features = ["bundled"] }
xcap = "0.0.14"
image = { version = "0.25", default-features = false, features = ["png", "webp", "bmp"] }
uuid = { version = "1.11", features = ["v4"] }
chrono = { version = "0.4", features = ["serde"] }
arboard = "3.7"
sha2 = "0.10"
hex = "0.4"
crc32fast = "1.5"

[target.'cfg(windows)'.dependencies]
clipboard-win = "5.4"
windows-core = "0.58"
windows = { version = "0.58", features = [
    "implement",
    "Foundation",
    "Foundation_Collections",
    "Graphics_Imaging",
    "Media_Ocr",
    "Storage",
    "Storage_Streams",
    "Win32_Devices_FunctionDiscovery",
    "Win32_Foundation",
    "Win32_Media_Audio",
    "Win32_Media_Audio_Endpoints",
    "Win32_Security",
    "Win32_Storage_FileSystem",
    "Win32_System_Com",
    "Win32_System_Com_StructuredStorage",
    "Win32_System_Diagnostics_ToolHelp",
    "Win32_System_IO",
    "Win32_System_Pipes",
    "Win32_System_Threading",
    "Win32_System_Variant",
    "Win32_UI_Shell_PropertiesSystem",
    "Win32_UI_WindowsAndMessaging",
] }
